version: "2"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: btb
      extra-rules: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - revive
    - unconvert
    - usestdlibvars

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
