version: v2

clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: btb/gen

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.12.0
    out: web/src/gen
    opt: target=ts
